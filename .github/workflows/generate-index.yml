name: Generate LeetCode Indexes & Metadata

on:
  workflow_run:
    workflows: ["Sync LeetCode"]
    types:
      - completed
  push:
    branches:
      - main
    paths:
      - 'leetcode/**'
      - 'scripts/**'
  workflow_dispatch:

jobs:
  update-indexes:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Index & Metadata Generator
        run: python scripts/generate_index.py
        env:
          LEETCODE_CSRF_TOKEN: ${{ secrets.LEETCODE_CSRF_TOKEN }}
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}

      - name: Commit and push updated indexes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main || true
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update LeetCode indexes, problem metadata, and explanations" && git push origin main)
