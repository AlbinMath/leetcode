name: Generate LeetCode Indexes & Metadata

on:
  push:
    paths:
      - 'leetcode/**'
      - 'scripts/**'
  workflow_dispatch:

jobs:
  update-indexes:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Index & Metadata Generator
        run: python scripts/generate_index.py

      - name: Commit and push updated indexes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add README.md All_Problems.md metadata/ patterns/ algorithms/ data-structures/ difficulty/ languages/ leetcode/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update LeetCode indexes, problem metadata, and explanations" && git push)
