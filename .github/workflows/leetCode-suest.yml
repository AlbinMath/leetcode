name: Sync LeetCode Quest

on:
  workflow_dispatch:

  schedule:
    - cron: "0 * * * *"

jobs:
  sync:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Sync LeetCode Quest submissions
        uses: joshcai/leetcode-sync@v1.7
        with:
          github-token: ${{ github.token }}
          leetcode-csrf-token: ${{ secrets.LEETCODE_CSRF_TOKEN }}
          leetcode-session: ${{ secrets.LEETCODE_SESSION }}

          # Store solutions inside this folder
          destination-folder: leetcode Quest

          verbose: true
          commit-header: "[LeetCode Quest]"